# docker-compose.yml
#
# Local dev only. Production runs on a free-tier host (Render/Neon) instead —
# see README's Deployment section. Redis/worker/beat/flower were removed
# when background jobs moved from Celery to FastAPI BackgroundTasks
# (app.services.workers) — one process instead of three, and no queue
# broker to run at all.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: exam_user
      POSTGRES_PASSWORD: exam_password
      POSTGRES_DB: exam_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://exam_user:exam_password@db:5432/exam_platform
      STORAGE_PATH: /app/storage
      APP_ENV: development
      DEBUG: "true"
    volumes:
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  postgres_data:
